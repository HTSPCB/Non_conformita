<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS - Gestione Segnalazioni</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- EmailJS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --scuro: #2c3e50; --blu: #3498db; --verde: #2ecc71; --rosso: #e74c3c; --giallo: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1050px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h1 { margin: 0; color: var(--scuro); font-size: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-primary { background: var(--blu); }
        .btn-success { background: var(--verde); }
        .btn-danger { background: var(--rosso); }
        .btn-warning { background: var(--giallo); color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; color: var(--scuro); }
        .badge { padding: 5px 10px; border-radius: 15px; font-weight: bold; font-size: 11px; color: white; display: inline-block; }
        .badge-verde { background: var(--verde); }
        .badge-rosso { background: var(--rosso); }
        
        /* Modal Style */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 420px; max-width: 90%; }
        .modal-content textarea, .modal-content input, .modal-content select { width: 100%; padding: 8px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📌 HTS - Gestione Segnalazioni Rapide</h1>
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <div>
                <label for="filtroAnno"><strong>Anno:</strong> </label>
                <select id="filtroAnno" onchange="caricaSegnalazioni()">
                    <option value="TUTTI">-- Tutti gli Anni --</option>
                    <option value="2026" selected>2026</option>
                    <option value="2025">2025</option>
                </select>
            </div>
            <div>
                <label for="filtroCliente"><strong>Cliente:</strong> </label>
                <select id="filtroCliente" onchange="caricaSegnalazioni()">
                    <option value="TUTTI">-- Tutti i Clienti --</option>
                </select>
            </div>
            <a href="index.html" class="btn btn-primary" style="text-decoration: none;">📋 Portale NC</a>
            <button class="btn btn-danger" onclick="eseguiLogout()">Esci</button>
        </div>
    </div>

    <div style="margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
        <label style="cursor: pointer; font-weight: bold; color: #2c3e50; display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" id="chkNascondiChiuse" onchange="caricaSegnalazioni()" style="width: 16px; height: 16px; cursor: pointer;">
            Nascondi segnalazioni chiuse (Stato Rosso)
        </label>
    </div>

    <div class="card">
        <button class="btn btn-primary" onclick="apriModalNuovaSegnalazione()">+ Nuova Segnalazione</button>
        <table>
            <thead>
                <tr>
                    <th>Codice CS</th>
                    <th>Cliente</th>
                    <th>Descrizione Problema & Tracciabilità</th>
                    <th>Stato</th>
                    <th>Azione</th>
                </tr>
            </thead>
            <tbody id="tabellaSegnalazioni">
                <!-- Dati caricati via JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal: Nuova Segnalazione -->
<div id="modalNuovaSegnalazione" class="modal">
    <div class="modal-content">
        <h3>Nuova Segnalazione</h3>
        <label>Codice CS</label>
        <input type="text" id="segCodice" placeholder="Es. CS12345">
        
        <label>Cliente</label>
        <input type="text" id="segCliente" placeholder="Es. Elesolution">
        
        <label>Descrizione Problema & Tracciabilità</label>
        <textarea id="segDescrizione" rows="4" placeholder="Dettagli del problema e tracciabilità..."></textarea>
        
        <!-- Checkbox per chiusura immediata -->
        <div style="background: #fdf2e9; padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px dashed #e67e22;">
            <label style="cursor: pointer; font-size: 13px; font-weight: bold; color: #d35400; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="segChiudiSubito" onchange="toggleNotaImmediata()" style="width: 16px; height: 16px; cursor: pointer;">
                Chiudi subito all'apertura (Già risolto / Falso allarme)
            </label>
            <div id="boxNotaImmediata" style="display: none; margin-top: 8px;">
                <label style="font-size: 11px; font-weight: bold;">Nota di chiusura:</label>
                <input type="text" id="segNotaChiusuraSubito" placeholder="Es. Risolto immediatamente sul campo" style="margin: 3px 0 0 0; padding: 6px; font-size: 12px;">
            </div>
        </div>
        
        <button class="btn btn-success" style="width: 100%;" onclick="salvaNuovaSegnalazione()">Salva Segnalazione</button>
        <button class="btn" style="background:#ccc; color:#333; width: 100%; margin-top: 5px;" onclick="annullaNuovaSegnalazione()">Annulla</button>
    </div>
</div>

<!-- Modal: Chiusura Segnalazione -->
<div id="modalChiusuraSegnalazione" class="modal">
    <div class="modal-content">
        <h3 style="color: #c0392b;">Chiusura Segnalazione</h3>
        <input type="hidden" id="idSegnalazioneDaChiudere">
        
        <label>Nota / Motivo di Chiusura (Obbligatorio):</label>
        <textarea id="notaChiusuraSegnalazione" rows="3" placeholder="Es. Risolto in accordo con il cliente / falso allarme..."></textarea>
        
        <button class="btn btn-danger" style="width: 100%; font-size: 14px;" onclick="confermaChiusuraSegnalazione()">Chiudi Segnalazione</button>
        <button class="btn" style="background:#ccc; color:#333; width: 100%; margin-top: 5px;" onclick="chiudiModal('modalChiusuraSegnalazione')">Annulla</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ecgcofjfxnlbwzfsjumq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FDaXHj0MhyCoypAnhgmO7Q_6QKYHeWP';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let segnalazioneDaChiudereObj = null;

    async function verificaSessione() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) {
            alert("⛔ Accesso negato: Devi effettuare il login dal portale principale.");
            window.location.href = 'index.html';
        } else {
            caricaSegnalazioni();
        }
    }

    function formattaData(dataString) {
        if (!dataString) return '';
        const d = new Date(dataString);
        return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    }

    async function caricaSegnalazioni() {
        const annoSelezionato = document.getElementById('filtroAnno').value;
        const clienteSelezionato = document.getElementById('filtroCliente').value;
        const nascondiChiuse = document.getElementById('chkNascondiChiuse').checked;

        let query = _supabase.from('segnalazioni').select('*');
        if (clienteSelezionato !== 'TUTTI') {
            query = query.eq('cliente', clienteSelezionato);
        }

        const { data, error } = await query.order('data_creazione', { ascending: false });
        if (error) { console.error(error); return; }

        let datiFiltrati = data || [];

        if (annoSelezionato !== 'TUTTI') {
            datiFiltrati = datiFiltrati.filter(s => {
                if (!s.data_creazione) return false;
                return new Date(s.data_creazione).getFullYear().toString() === annoSelezionato;
            });
        }

        if (nascondiChiuse) {
            datiFiltrati = datiFiltrati.filter(s => s.stato !== 'ROSSO');
        }

        const { data: tuttiDati } = await _supabase.from('segnalazioni').select('*');
        if (tuttiDati) aggiornaFiltroClienti(tuttiDati);

        const tbody = document.getElementById('tabellaSegnalazioni');
        tbody.innerHTML = '';

        if (datiFiltrati.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #7f8c8d;">Nessuna segnalazione trovata con i filtri selezionati.</td></tr>`;
            return;
        }

        datiFiltrati.forEach(s => {
            let statoSeg = s.stato || 'VERDE';
            let badgeClass = statoSeg === 'VERDE' ? 'badge-verde' : 'badge-rosso';
            let testoStato = statoSeg === 'VERDE' ? 'Aperta' : 'Chiusa';
            
            let dataCreazioneFmt = formattaData(s.data_creazione);
            let dettagliStr = s.descrizione_tracciabilita || '';
            dettagliStr += `<br><small style="color: #666;">Aperto (${dataCreazioneFmt})</small>`;

            if (statoSeg === 'ROSSO' && s.nota_chiusura) {
                let dataChiusuraFmt = formattaData(s.data_chiusura);
                dettagliStr += `<br><small style="color: #c0392b; font-weight: bold;">🔴 Nota Chiusura (${dataChiusuraFmt}): ${s.nota_chiusura}</small>`;
            }

            let azioniHtml = '';
            if (statoSeg === 'VERDE') {
                azioniHtml = `
                    <button class="btn btn-success" style="font-size: 11px; margin-right: 5px;" onclick="trasformaInNC('${s.id}', '${s.codice_cs}', '${s.cliente}', \`${s.descrizione_tracciabilita}\`)">
                        ➡️ Trasforma in NC
                    </button>
                    <button class="btn btn-danger" style="font-size: 11px;" onclick="apriModalChiusura('${s.id}')">
                        🔒 Chiudi Segnalazione
                    </button>
                `;
            } else {
                azioniHtml = `<small style="color: #c0392b; font-weight: bold;">Segnalazione Chiusa</small>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td><strong>${s.codice_cs}</strong></td>
                    <td>${s.cliente}</td>
                    <td>${dettagliStr}</td>
                    <td><span class="badge ${badgeClass}">${testoStato}</span></td>
                    <td>${azioniHtml}</td>
                </tr>
            `;
        });
    }

    function aggiornaFiltroClienti(dati) {
        const select = document.getElementById('filtroCliente');
        const valoreAttuale = select.value;
        const clientiUnici = [...new Set(dati.map(d => d.cliente))].filter(Boolean).sort();
        
        select.innerHTML = '<option value="TUTTI">-- Tutti i Clienti --</option>';
        clientiUnici.forEach(c => {
            select.innerHTML += `<option value="${c}" ${c === valoreAttuale ? 'selected' : ''}>${c}</option>`;
        });
    }

    function toggleNotaImmediata() {
        const isChecked = document.getElementById('segChiudiSubito').checked;
        document.getElementById('boxNotaImmediata').style.display = isChecked ? 'block' : 'none';
    }

    function apriModalNuovaSegnalazione() {
        document.getElementById('segCodice').value = '';
        document.getElementById('segCliente').value = '';
        document.getElementById('segDescrizione').value = '';
        document.getElementById('segChiudiSubito').checked = false;
        document.getElementById('segNotaChiusuraSubito').value = '';
        document.getElementById('boxNotaImmediata').style.display = 'none';
        
        document.getElementById('modalNuovaSegnalazione').style.display = 'flex';
    }

    function chiudiModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.style.display = 'none';
        }
    }

    function annullaNuovaSegnalazione() {
        document.getElementById('segCodice').value = '';
        document.getElementById('segCliente').value = '';
        document.getElementById('segDescrizione').value = '';
        document.getElementById('segChiudiSubito').checked = false;
        document.getElementById('segNotaChiusuraSubito').value = '';
        document.getElementById('boxNotaImmediata').style.display = 'none';
        
        chiudiModal('modalNuovaSegnalazione');
    }

    async function salvaNuovaSegnalazione() {
        const codice = document.getElementById('segCodice').value;
        const cliente = document.getElementById('segCliente').value;
        const descrizione = document.getElementById('segDescrizione').value;
        const chiudiSubito = document.getElementById('segChiudiSubito').checked;
        const notaChiusura = document.getElementById('segNotaChiusuraSubito').value;

        if(!codice || !cliente) { alert("Compila Codice CS e Cliente!"); return; }
        if(chiudiSubito && !notaChiusura) { alert("Inserisci una nota di chiusura per la chiusura immediata!"); return; }

        const { data: { user } } = await _supabase.auth.getUser();
        const emailUtente = user ? user.email : 'Sconosciuto';
        const timestampCorrente = new Date().toISOString();

        const nuovaSegnalazione = {
            codice_cs: codice,
            cliente: cliente,
            descrizione_tracciabilita: descrizione,
            stato: chiudiSubito ? 'ROSSO' : 'VERDE',
            creato_da: emailUtente,
            data_creazione: timestampCorrente,
            chiuso_da: chiudiSubito ? emailUtente : null,
            data_chiusura: chiudiSubito ? timestampCorrente : null,
            nota_chiusura: chiudiSubito ? notaChiusura : null
        };

        const { error } = await _supabase.from('segnalazioni').insert([nuovaSegnalazione]);

        if (error) {
            alert("Errore durante il salvataggio: " + error.message);
        } else {
            if (chiudiSubito) {
                inviaEmailChiusuraSegnalazione(nuovaSegnalazione, notaChiusura);
            } else {
                inviaEmailNuovaSegnalazione(nuovaSegnalazione);
            }

            chiudiModal('modalNuovaSegnalazione');
            caricaSegnalazioni();
        }
    }

    function inviaEmailNuovaSegnalazione(seg) {
        const SERVICE_ID = 'service_6qpwt72'; 
        const TEMPLATE_ID = 'template_dwibda2'; 
        const PUBLIC_KEY = 'jBAj4-jyCvj8FReZI'; 

        const templateParams = {
            codice_cs: seg.codice_cs,
            cliente: seg.cliente,
            descrizione_tracciabilita: seg.descrizione_tracciabilita,
            creato_da: seg.creato_da,
            date: new Date(seg.data_creazione).toLocaleDateString('it-IT')
        };

        emailjs.init(PUBLIC_KEY);
        emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
            .then(response => {
                console.log('Email segnalazione inviata!', response.status, response.text);
            }, error => {
                console.error('Errore invio email:', error);
            });
    }

    async function apriModalChiusura(id) {
        const { data, error } = await _supabase.from('segnalazioni').select('*').eq('id', id).single();
        if (error || !data) { alert("Errore recupero segnalazione"); return; }

        segnalazioneDaChiudereObj = data;
        document.getElementById('idSegnalazioneDaChiudere').value = id;
        document.getElementById('notaChiusuraSegnalazione').value = '';
        document.getElementById('modalChiusuraSegnalazione').style.display = 'flex';
    }

    async function confermaChiusuraSegnalazione() {
        const id = document.getElementById('idSegnalazioneDaChiudere').value;
        const nota = document.getElementById('notaChiusuraSegnalazione').value;

        if (!nota) { alert("Inserisci una nota di chiusura obbligatoria!"); return; }

        const { data: { user } } = await _supabase.auth.getUser();
        const emailUtente = user ? user.email : 'Sconosciuto';
        const timestampCorrente = new Date().toISOString();

        const payloadChiusura = {
            stato: 'ROSSO',
            nota_chiusura: nota,
            chiuso_da: emailUtente,
            data_chiusura: timestampCorrente
        };

        const { error } = await _supabase.from('segnalazioni').update(payloadChiusura).eq('id', id);

        if (error) {
            alert("Errore durante la chiusura: " + error.message);
        } else {
            segnalazioneDaChiudereObj.chiuso_da = emailUtente;
            segnalazioneDaChiudereObj.data_chiusura = timestampCorrente;

            inviaEmailChiusuraSegnalazione(segnalazioneDaChiudereObj, nota);
            chiudiModal('modalChiusuraSegnalazione');
            caricaSegnalazioni();
        }
    }

    function inviaEmailChiusuraSegnalazione(seg, notaChiusura) {
        const SERVICE_ID = 'service_6qpwt72'; 
        const TEMPLATE_ID = 'template_q0ru7wg'; 
        const PUBLIC_KEY = 'jBAj4-jyCvj8FReZI'; 

        const templateParams = {
            codice_cs: seg.codice_cs,
            cliente: seg.cliente,
            descrizione_tracciabilita: seg.descrizione_tracciabilita,
            nota_chiusura: notaChiusura,
            chiuso_da: seg.chiuso_da,
            data_chiusura: new Date(seg.data_chiusura).toLocaleDateString('it-IT')
        };

        emailjs.init(PUBLIC_KEY);
        emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
            .then(response => {
                console.log('Email chiusura segnalazione inviata!', response.status, response.text);
            }, error => {
                console.error('Errore invio email chiusura:', error);
            });
    }

    function trasformaInNC(id, codice, cliente, descrizione) {
        if (!confirm(`Vuoi trasformare la segnalazione ${codice} in una Non Conformità? Verrai reindirizzato al portale per completare i dati.`)) return;

        const datiTrasformazione = {
            id_segnalazione: id,
            codice: codice,
            cliente: cliente,
            descrizione: descrizione
        };
        
        localStorage.setItem('nc_da_segnalazione', JSON.stringify(datiTrasformazione));
        window.location.href = 'index.html';
    }

    async function eseguiLogout() {
        await _supabase.auth.signOut();
        window.location.href = 'index.html';
    }

    verificaSessione();
</script>
</body>
</html>
